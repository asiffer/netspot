on:
  workflow_dispatch:
  pull_request:
      paths:
      - "**.go"
      - go.sum
      - go.mod
      - .github/workflows/build.yml
  push:
    branches:
      - master
    paths:
      - "**.go"
      - go.sum
      - go.mod
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: make build-all
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: bin/*
